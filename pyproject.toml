[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-startup-arena"
version = "0.1.0"
description = "A local startup strategy arena for LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.4",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_startup_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
